# A/B-aware GRUB config for Sequoia Intel (LattePanda).
# Selected via GRUB_CFG in kas/common-sequoia.yaml and picked up by the
# bootimg-efi wic plugin. Boots rootfs-a by default; the post-install.sh
# OTA script rewrites the menu entry to rootfs-b (and vice versa) by label.
menuentry "Sequoia (rootfs-a)" {
    linux /Image root=LABEL=rootfs-a rootwait rw quiet console=ttyS0,115200n8 console=tty0
}
menuentry "Sequoia (rootfs-b)" {
    linux /Image root=LABEL=rootfs-b rootwait rw quiet console=ttyS0,115200n8 console=tty0
}
