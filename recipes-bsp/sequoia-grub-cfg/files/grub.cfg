# Sequoia Intel (LattePanda) — A/B-aware GRUB EFI configuration
#
# This config is stored in the EFI System Partition at EFI/BOOT/grub.cfg.
# It boots from the rootfs partition identified by its filesystem label
# (rootfs-a or rootfs-b).  post-install.sh replaces the label name when
# activating a new OTA slot:
#
#   sed -i "s|rootfs-[ab]|rootfs-<new_slot>|g" /boot/efi/EFI/BOOT/grub.cfg
#
# The EFI partition is mounted read-write only during OTA post-install and
# immediately restored to read-only.
#
# NOTE: "search --label" reads the ext4 filesystem label (not the GPT
# partition name).  post-install.sh calls e2label to relabel the newly
# written rootfs partition so the label matches the slot name.

set default=0
set timeout=3

menuentry 'Sequoia OS' {
    # Find the active rootfs partition by its filesystem label.
    search --no-floppy --label --set=root rootfs-a
    # Load the kernel from the rootfs partition.
    # genericx86-64 creates a /boot/bzImage symlink pointing to the versioned
    # kernel image (e.g. /boot/bzImage-6.6.x-yocto-standard).
    linux /boot/bzImage root=LABEL=rootfs-a rootwait rw quiet \
        console=ttyS0,115200n8 console=tty0
}
