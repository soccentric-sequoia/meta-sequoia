BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-sequoia"
BBFILE_PATTERN_meta-sequoia = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sequoia = "10"

# No dependency on 'raspberrypi' — this layer targets Intel x86 (LattePanda).
# 'intel' is optional (meta-intel adds CPU-specific tuning but is not required
# for genericx86-64 which is already in meta-yocto-bsp/poky).
LAYERDEPENDS_meta-sequoia = "core"
LAYERSERIES_COMPAT_meta-sequoia = "scarthgap"
