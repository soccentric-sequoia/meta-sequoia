## SWUpdate main config for Sequoia OS
#
# Daemon mode: SWUpdate listens for .swu packages on all interfaces.
# The web UI is served on port 8080.

globals:
{
    verbose = true;
    loglevel = 3;
    syslog  = true;
}

identify:
{
    name     = "sequoia";
    hardware-revision = "1.0";
};

webserver:
{
    document-root = "/usr/share/swupdate-www";
    port          = 8080;
};

suricatta:
{
    # Uncomment and configure to enable Hawkbit integration.
    # url        = "https://hawkbit.example.com";
    # tenant     = "DEFAULT";
    # id         = "sequoia-01";
    # polling    = 45;
};
