# nginx config for SWUpdate web interface (Sequoia)
server {
    listen       8080;
    server_name  _;
    root         /usr/share/swupdate-www;
    index        index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy SWUpdate REST API and websocket to the swupdate daemon socket
    location /upload {
        proxy_pass         http://unix:/var/run/swupdate/swupdate.sock:/upload;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    location /ws {
        proxy_pass          http://unix:/var/run/swupdate/swupdate.sock:/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }
}
