# Drop-in for swupdate.service
# Clears the default ExecStart and replaces it with one that:
#   • reads our libconfig-format config file
#   • enables the built-in Mongoose web UI on port 8080
#   • serves the swupdate-www React front-end

[Service]
ExecStart=
ExecStart=/usr/bin/swupdate \
    -f /etc/swupdate/swupdate.cfg \
    -w "--document-root /usr/share/swupdate/www --port 8080"
